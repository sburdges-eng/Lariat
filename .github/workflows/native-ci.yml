# LariatNative (Swift / GRDB) test gate. Before this workflow, no CI ran the
# swift test suites — Swift↔JS parity rested entirely on local runs, so a
# native regression could land silently (2026-07-12 costing-audit finding).
#
# Path-filtered to LariatNative (plus this file): macOS runners are slower
# than ubuntu, so the gate only spends them when the native app changes.
# Test suites use tmpdir fixture DBs only — the live data/lariat.db is
# gitignored and never touched.

name: native-ci

on:
  # No `branches:` filter on pull_request, matching ci.yml — see its header for
  # the history. It was [main] here, so a stacked native PR (the normal shape
  # for dependent work) ran no Swift gate at all: #609 is entirely Swift, was
  # opened against #607's branch, and showed one green web check covering none
  # of the code it changed. Retargeting and reopening don't fire the event
  # either, so the stack's only gate was the author's local run.
  #
  # ci.yml was fixed for this in #583/#587; native-ci was left behind.
  pull_request:
    paths:
      - 'LariatNative/**'
      - '.github/workflows/native-ci.yml'
      # Both stacks load these fixtures verbatim — they ARE the parity
      # oracle, so a JS-side edit to one must re-run the Swift suite.
      - 'tests/fixtures/**'
      # Swift trusts schema_migrations.MAX(version) from here as its drift
      # marker; a schema edit that skips this gate is exactly the silent
      # divergence the gate was added to catch.
      - 'lib/db.ts'
      # The Python BEO/BOM engine IS the oracle the Tests/Fixtures parity files
      # are generated from. Editing it without touching LariatNative changes
      # what those fixtures should say, which is exactly how they went stale
      # between 2026-07-28 and 2026-08-29.
      - 'scripts/lib/bom_expand.py'
      - 'scripts/lib/beo_pull.py'
      - 'scripts/beo_cascade_cli.py'
      - 'scripts/dev/export_beo_fixtures.py'
      - 'scripts/dev/export_bom_expand_fixtures.py'
  push:
    branches: [main]
    paths:
      - 'LariatNative/**'
      - '.github/workflows/native-ci.yml'
      # Both stacks load these fixtures verbatim — they ARE the parity
      # oracle, so a JS-side edit to one must re-run the Swift suite.
      - 'tests/fixtures/**'
      # Swift trusts schema_migrations.MAX(version) from here as its drift
      # marker; a schema edit that skips this gate is exactly the silent
      # divergence the gate was added to catch.
      - 'lib/db.ts'
      # The Python BEO/BOM engine IS the oracle the Tests/Fixtures parity files
      # are generated from. Editing it without touching LariatNative changes
      # what those fixtures should say, which is exactly how they went stale
      # between 2026-07-28 and 2026-08-29.
      - 'scripts/lib/bom_expand.py'
      - 'scripts/lib/beo_pull.py'
      - 'scripts/beo_cascade_cli.py'
      - 'scripts/dev/export_beo_fixtures.py'
      - 'scripts/dev/export_bom_expand_fixtures.py'


  # Nightly, inside the window where this repo's suites hide failures.
  #
  # The venue service day runs 02:00-02:00 America/Denver, so from 18:00 Denver
  # (00:00 UTC) until 02:00 Denver (08:00 UTC) the UTC date and the service date
  # name different days. Code that stamps one and reads the other passes for
  # eighteen hours and fails for six. That is not hypothetical: on 2026-08-30 it
  # put ten LariatDBTests and one web suite red on main (#646), and it had
  # survived seven merges because every green run in the repo's history landed
  # between 10:00 and 11:30 UTC.
  #
  # 05:00 UTC is 23:00 Denver — squarely inside the band. Scheduled runs only
  # fire on the default branch, which is exactly the thing worth watching.
  schedule:
    - cron: '0 5 * * *'
permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: swift build + test
    # macos-26 (Xcode 26 / Swift 6.2+): the macos-15 Swift 6.1 solver fails
    # type-checking ReceivingRepository.swift:173 ("unable to type-check this
    # expression in reasonable time"); newer toolchains match local dev.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: LariatNative/.build
          key: spm-${{ runner.os }}-${{ hashFiles('LariatNative/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The Tests/Fixtures/{BeoCascade,BomExpand} JSON files are the Python
      # oracle frozen for the Swift port to assert against. Nothing regenerated
      # or compared them, so they drifted silently: the batch-ordering model
      # shipped in the engine on 2026-07-28 and the committed fixtures still
      # carried the pre-batch shape when this step was added on 2026-08-29.
      #
      # Runs BEFORE swift test: a stale fixture makes the parity suite assert
      # the wrong thing, and "fixtures are stale" is a clearer failure than a
      # parity test failing against them.
      - name: BEO/BOM parity fixtures match the Python oracle
        run: |
          python3 scripts/dev/export_beo_fixtures.py --check
          python3 scripts/dev/export_bom_expand_fixtures.py --check

      - name: swift test (LariatModel + LariatDB + LariatApp)
        run: swift test
        working-directory: LariatNative
