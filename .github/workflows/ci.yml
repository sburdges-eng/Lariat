# PR + main-push CI gate. Mirrors the local pre-commit + `npm run verify`
# discipline so a regression that slips past a developer's machine still gets
# caught before merge.
#
# Steps run as discrete jobs (rather than `npm run verify` as one) so a red
# build points cleanly at which gate failed. Order matches the verify
# script: typecheck → jest → rule tests → schema migrations → next build.

name: CI

on:
  # No `branches:` filter on pull_request, deliberately. It used to be
  # [main], which meant a PR opened against a feature branch — a stacked PR,
  # the normal shape for dependent work here — ran no gates at all. #583
  # merged that way, and #587 sat green-looking with zero checks until it was
  # retargeted. Neither retargeting nor reopening fires the event either, so
  # the only way to get CI on a stack was an empty commit.
  #
  # Every PR now runs, whatever it targets. Pushes stay main-only so feature
  # branches are gated once per PR rather than on every commit.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # lib/devCodeSearch.ts shells out to ripgrep, and returns a distinct
      # `rg_unavailable` outcome when it is missing — which is what the
      # runner produced, because rg is not in the ubuntu-latest image.
      # Installing it means the code_search suite tests the real path here
      # the way it does on a developer machine, rather than being skipped.
      - name: install ripgrep (lib/devCodeSearch shells out to rg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # Before the suites, not just before the build: test-discover-route
      # asserts the stamped V.I.NN.NNN release version rather than the
      # package.json semver fallback, so it needs version.json to exist.
      # `prebuild` stamps again for the build itself, which is idempotent.
      - name: stamp build version (V.I.NN.NNN)
        run: npm run version:stamp

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # Fails if any tests/js suite exists that `npm run verify` would not
      # run. 203 suites had drifted into being written but never executed;
      # this stops that recurring silently.
      - name: test-suite wiring (orphaned-suite drift detector)
        run: npm run test:suite-wiring

      - name: jest unit tests
        run: npm run test:unit

      - name: HACCP rule tests
        run: npm run test:rules

      - name: i18n catalog tests
        run: npm run test:i18n

      - name: BOH sheet + PIN-coverage tests
        run: npm run test:boh

      - name: purchasing vendor compare + mapping tests
        run: npm run test:purchasing-vendor

      - name: KDS bump protocol route test
        run: npm run test:kds-bump

      - name: backup integrity + restore drill test
        run: npm run test:backup

      - name: Sick-note retention report test
        run: npm run test:sick-note-retention

      - name: PIN-gate coverage (mutation-route drift detector)
        run: npm run test:pin-gates

      - name: checkjs api baseline (ts-nocheck drift detector)
        run: npm run test:checkjs-api

      - name: idempotency coverage (mutation-route drift detector)
        run: npm run test:idempotency

      # Security/correctness suites (node:test) that jest's app/__tests__
      # testMatch never swept and no workflow named — so they ran in no gate.
      # DB-safe (in-memory/tmp only), verified green before wiring.
      - name: security + sync/replication regression suites
        run: npm run test:regression-core

      - name: 86 sub-recipe cascade tests
        run: npm run test:sub-recipe-graph

      - name: schema-migration idempotency
        run: npm run test:schema

      - name: BEO estimate + food-cost + min-spend tests
        run: npm run test:beo

      - name: costing engine + unit-conversion tests
        run: npm run test:costing

      - name: recipe BOM audit (index ↔ normalized ↔ expand)
        run: npm run test:recipe-bom-audit

      # Previously-ungated node:test suites (jest test:unit only sweeps
      # app/__tests__/**). Each of the 90 suites was verified green from a
      # clean empty-DB checkout in an isolated worktree before wiring. They all
      # use in-memory/tmp DBs — asserted, not assumed, by the "no suite may
      # touch the shared database" step below. Grouped by domain so a red build
      # points at the affected area.
      - name: regression — infra/tooling suites
        run: npm run test:regression-infra

      # Own step on purpose: these start a real mDNS responder, and sharing a
      # `node --test` invocation with test-peers-route lets the responder be
      # discovered by the suite asserting discovery finds nothing.
      - name: regression — mDNS suites (isolated responder)
        run: npm run test:regression-mdns

      - name: regression — food-safety + compliance suites
        run: npm run test:regression-foodsafety

      - name: regression — assistant + datapack suites
        run: npm run test:regression-assistant

      - name: regression — ops API suites
        run: npm run test:regression-ops

      - name: regression — costing/inventory data suites
        run: npm run test:regression-costing

      - name: regression — recipe/menu suites
        run: npm run test:regression-recipe

      - name: regression — BEO/events/shows suites
        run: npm run test:regression-events

      - name: install python test deps
        run: bash scripts/install-python-deps.sh

      # This used to be `rm -f data/lariat.db …` here, commented "an earlier
      # node:test suite can leave a stray schema-only data/lariat.db". Five did
      # — see docs/audit/2026-08-01-shared-db-isolation-audit.md — and sweeping
      # the file away hid them. Now it is an error, because the DDL those
      # suites ran against a database their siblings were concurrently using is
      # what produced the intermittent SQLITE_SCHEMA failures on #599.
      - name: no suite may touch the shared database
        run: |
          if [ -e data/lariat.db ]; then
            echo "::error::A node:test suite created data/lariat.db. Suites must"
            echo "::error::use :memory: or a tmp path via setDbPathForTest()."
            ls -la data/lariat.db*
            echo "Detection method: docs/audit/2026-08-01-shared-db-isolation-audit.md"
            exit 1
          fi

      # tests/python (ingest parsers, BOM expand, cascade CLI, normalizers,
      # datapack index builders). The live-DB seed-coverage check self-skips
      # when data/lariat.db is absent (gitignored) but FAILS on an empty one
      # by design — so the guard above is also what keeps this step honest.
      - name: python test suite
        run: npm run test:python

      # Shows suites (node:test) build/parse an XLSX fixture via the venv
      # python (build_shows_fixture.py / ingest_shows_xlsx.py), so they run
      # after install-python-deps. Hermetic — own tmp SQLite, no data/lariat.db.
      - name: regression — shows (XLSX via python venv)
        run: npm run test:regression-shows

      # Repeated because shows is the one node:test lane that runs after the
      # guard above (it needs the python venv). Same check, so the last lane
      # is covered too.
      - name: no suite may touch the shared database (post-shows)
        run: |
          if [ -e data/lariat.db ]; then
            echo "::error::test:regression-shows created data/lariat.db."
            ls -la data/lariat.db*
            echo "Detection method: docs/audit/2026-08-01-shared-db-isolation-audit.md"
            exit 1
          fi

      # Publishes a real line/branch/function number and fails below the
      # floors in scripts/coverage-sweep.mjs. Note the percentage covers files
      # the suites LOAD — the step also prints loaded-vs-on-disk per directory,
      # which is where the actual holes show (app/ is ~135 of 364).
      # Quoted: an unquoted step name containing ": " parses as a nested
      # mapping and takes the whole workflow file down with it.
      - name: 'code coverage (floors: line 85 / branch 81 / func 87)'
        run: npm run coverage -- --check

      - name: next build
        run: npm run build
        env:
          NODE_ENV: production
